name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch or tag to generate from"
        required: false
        default: "main"
        type: string
      publish_release:
        description: "Create a GitHub Release from source_ref"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Check consistency
        run: python tools/check_consistency.py

      - name: Run checker tests
        run: python -m pytest -q tests/test_check_consistency.py tests/test_check_release_package.py tests/test_public_node_reference.py tests/test_peak_hold_waterfall_recipe.py tests/test_peak_hold_waterfall_demo.py

      - name: Compile Python sources
        run: python -m py_compile src/dh_audio_toolkit.py tests/blender_52_regression.py tools/check_consistency.py tools/check_release_package.py tools/export_public_node_interfaces.py tools/build_public_node_reference.py tools/create_peak_hold_waterfall_demo.py tests/test_check_consistency.py tests/test_check_release_package.py tests/test_public_node_reference.py tests/test_peak_hold_waterfall_recipe.py tests/test_peak_hold_waterfall_demo.py

  blender:
    name: Blender 5.2 regression (optional)
    if: ${{ vars.BLENDER_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Blender 5.2
        uses: BradyAJohnston/setup-blender@v5.1.0
        with:
          version: '5.2.0'

      - name: Run Blender regression suite
        run: blender --background --python tests/blender_52_regression.py

  generate-assets:
    name: Generate Blender release assets
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: generated-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Blender 5.2
        uses: BradyAJohnston/setup-blender@v5.1.0
        with:
          version: '5.2.0'

      - name: Generate and validate release
        working-directory: source
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p releases temp
          blender --background --factory-startup \
            --python tests/blender_52_regression.py -- \
            --report "temp/blender_52_release_report.json" \
            --release "releases/DH Audio Toolkit ${version}/DH Audio Toolkit ${version}.blend"
          python tools/check_consistency.py --require-release

      - name: Check out generated-assets branch
        uses: actions/checkout@v4
        with:
          ref: generated-assets
          path: generated
          fetch-depth: 0

      - name: Publish generated files to branch
        shell: bash
        run: |
          version="$(tr -d '\r\n' < source/VERSION)"
          mkdir -p "generated/releases/DH Audio Toolkit ${version}"
          cp "source/releases/DH Audio Toolkit ${version}/DH Audio Toolkit ${version}.blend" \
            "generated/releases/DH Audio Toolkit ${version}/"
          cp "source/releases/DH Audio Toolkit ${version}/blender_assets.cats.txt" \
            "generated/releases/DH Audio Toolkit ${version}/"
          cp "source/docs/RELEASE_NOTES_${version}.md" generated/docs/ 2>/dev/null || true
          cd generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases docs
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
            exit 0
          fi
          git commit -m "build: generate Blender ${version} assets"
          git push origin HEAD:generated-assets

  package-release:
    name: Package GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    needs: [static, generate-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Blender 5.2
        uses: BradyAJohnston/setup-blender@v5.1.0
        with:
          version: '5.2.0'

      - name: Generate release bundle
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          blender --background --factory-startup \
            --python tests/blender_52_regression.py -- \
            --release "releases/DH Audio Toolkit ${version}/DH Audio Toolkit ${version}.blend"
          python tools/check_consistency.py --require-release
          sed "s/{{VERSION}}/${version}/g" docs/ASSET_LIBRARY_INSTALL.md > "releases/DH Audio Toolkit ${version}/README.md"
          # Blender may leave .blend1/.blend2 recovery files beside the release.
          # They are useful locally but must never ship as distributable assets.
          find "releases/DH Audio Toolkit ${version}" -type f \
            \( -name '*.blend[0-9]' -o -name '*.blend[0-9][0-9]' \) \
            -print -delete
          mkdir -p dist
          (cd releases && zip -r "../dist/DH-Audio-Toolkit-${version}.zip" "DH Audio Toolkit ${version}")
          python tools/check_release_package.py \
            --archive "dist/DH-Audio-Toolkit-${version}.zip" \
            --version "$version"
          sha256sum "dist/DH-Audio-Toolkit-${version}.zip" \
            > "dist/DH-Audio-Toolkit-${version}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DH Audio Toolkit ${version}" \
              --notes-file "docs/RELEASE_NOTES_${version}.md"
          fi
          gh release upload "$tag" \
            "dist/DH-Audio-Toolkit-${version}.zip" \
            "dist/DH-Audio-Toolkit-${version}.zip.sha256" \
            "releases/DH Audio Toolkit ${version}/DH Audio Toolkit ${version}.blend" \
            "releases/DH Audio Toolkit ${version}/blender_assets.cats.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
