name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Check consistency
        run: python tools/check_consistency.py

      - name: Run checker tests
        run: python -m pytest -q tests/test_check_consistency.py

      - name: Compile Python sources
        run: python -m py_compile src/dh_audio_toolkit.py tests/blender_52_regression.py tools/check_consistency.py tests/test_check_consistency.py

  blender:
    name: Blender 5.2 regression (optional)
    if: ${{ vars.BLENDER_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Blender 5.2
        uses: BradyAJohnston/setup-blender@v1
        with:
          version: '5.2.0'

      - name: Run Blender regression suite
        run: blender --background --python tests/blender_52_regression.py
